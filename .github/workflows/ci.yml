# CI for the WPF screenshot tool: every push (any branch) runs the same quality gates the
# project uses locally (harness algorithm tests, offline OCR with the bundled model, i18n key
# parity, --smoke service/window instantiation) and then attaches a DRAFT release with a
# self-contained zip — the tag is only created if the draft is ever published, so Releases
# simply collect one draft per commit. Pushing a v* tag instead publishes a real release.
# WPF + Windows-only APIs → windows-latest runner.
name: CI

on:
  push: # every commit on any branch; a tag push routes to the `release` job below
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIG: Release
  EXE_DIR: src/ModernScreenShot.App/bin/Release/net10.0-windows/win-x64

jobs:
  build-test:
    name: Build & gates (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ModernScreenShot.sln

      - name: Build (Release)
        run: dotnet build ModernScreenShot.sln -c $env:CONFIG --no-restore

      - name: Harness — core algorithm tests
        run: dotnet run --project tools/Harness -c $env:CONFIG --no-build -- core

      - name: Harness — offline OCR (bundled fast model, no download)
        run: dotnet run --project tools/Harness -c $env:CONFIG --no-build -- ocr

      - name: Localization key parity (zh-CN vs en-US)
        shell: pwsh
        run: tools/check-i18n.ps1

      - name: App smoke test
        shell: pwsh
        run: |
          # --smoke resolves every DI singleton and instantiates the editor/history/settings/
          # countdown/OOBE/OCR/pin windows off-screen, then exits 0/1. Guard with an explicit
          # 3-minute kill so a hung window can never burn the whole job timeout.
          $p = Start-Process -FilePath "$env:EXE_DIR/ModernScreenShot.App.exe" -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(180000)) {
            $p.Kill($true)
            Write-Host "::error::smoke test hung and was killed after 180 s"
            exit 1
          }
          Write-Host "smoke exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Publish (framework-dependent win-x64)
        run: dotnet publish src/ModernScreenShot.App -c $env:CONFIG -o "${{ github.workspace }}/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernScreenShot-win-x64
          path: publish/
          if-no-files-found: error

  dev-draft:
    name: Draft release (every push)
    # Tag pushes go to the `release` job instead; draft creation needs write access, which
    # forks don't get — and pull_request events don't exist in this workflow anyway.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create/replace the draft release
    steps:
      # Full history: the version base comes from `git describe` over the v* tags (Agent.md).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        shell: pwsh
        run: |
          # base = nearest v* tag without the v ("0.0.0" before the first tag), N = the workflow's
          # global run number (monotonic per push, stable across re-runs of one commit).
          $describe = git describe --tags --match "v*" 2>$null
          $described = $LASTEXITCODE -eq 0 -and $describe
          $global:LASTEXITCODE = 0 # no tag yet is the expected path; the runner fails a pwsh step on a leftover nonzero LASTEXITCODE
          $base = if ($described) { $describe -replace '^v','' -replace '-\d+-g[0-9a-f]+$','' } else { "0.0.0" }
          $version = "$base-dev.$env:GITHUB_RUN_NUMBER+g$($env:GITHUB_SHA.Substring(0, 7))"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "version: $version"

      # Self-contained so the zip runs without the .NET Desktop Runtime installed; the version
      # is stamped into the assembly (shown in About / the startup log via AppVersion.Display).
      # IncludeSourceRevisionInInformationalVersion=false: the SDK would otherwise append the
      # full commit SHA after our value, which already carries the short SHA.
      - name: Publish self-contained win-x64
        run: dotnet publish src/ModernScreenShot.App -c $env:CONFIG -r win-x64 --self-contained true "-p:InformationalVersion=$env:VERSION" -p:IncludeSourceRevisionInInformationalVersion=false -o "${{ github.workspace }}/publish"

      - name: Attach draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "dev-$sha"
          # Re-running CI for the same commit leaves a stale draft — replace it, but never
          # touch a published release (drafts carry no tag until they are published).
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $existing = gh release view $tag --json isDraft | ConvertFrom-Json
            if ($existing.isDraft) { gh release delete $tag --yes }
          }
          $zip = "ModernScreenShot-$($env:VERSION -replace '\+', '-')-win-x64.zip" # '+' is unwieldy in download URLs
          Compress-Archive -Path publish/* -DestinationPath $zip -Force
          $notes = "版本号 $env:VERSION（base-dev.构建号+commit，规则见 Agent.md）。`n`nself-contained，解压即用，无需安装 .NET 运行时。这是 Draft，仅供下载测试；要发正式版请打 v* 标签。"
          gh release create $tag $zip --draft --target $env:GITHUB_SHA --title "Dev $env:VERSION" --notes $notes

  release:
    name: Release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload the zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag itself is the version (v0.1.0 → 0.1.0), stamped into the assembly.
      - name: Publish self-contained win-x64
        shell: pwsh
        run: dotnet publish src/ModernScreenShot.App -c $env:CONFIG -r win-x64 --self-contained true "-p:InformationalVersion=$($env:GITHUB_REF_NAME -replace '^v','')" -p:IncludeSourceRevisionInInformationalVersion=false -o "${{ github.workspace }}/publish"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "${{ github.workspace }}/ModernScreenShot-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "ModernScreenShot-$env:GITHUB_REF_NAME-win-x64.zip" --generate-notes --title "$env:GITHUB_REF_NAME"
